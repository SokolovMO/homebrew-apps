name: Check published casks
on:
  workflow_dispatch:
  schedule:
    - cron: '23 7 * * *'
  push:
    paths:
      - 'Casks/**'
      - 'scripts/update_casks.py'
      - 'tests/**'
      - '.github/workflows/check-casks.yml'
permissions:
  contents: read
jobs:
  freshness:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: python3 -m unittest discover -s tests
      - run: python3 scripts/update_casks.py --check
